# Ocular Manzanilla — fragmento theme: para ~/.config/gh-dash/config.yml
theme:
    colors:
        text:
            primary: "#3f372d"
            secondary: "#675f57"
            inverted: "#f5efe7"
            faint: "#817a73"
            warning: "#835000"
            success: "#276819"
            error: "#9b393f"
        background:
            selected: "#d9d3c9"
        border:
            primary: "#cdc6bd"
            secondary: "#d9d3c9"
            faint: "#e3ddd4"
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
