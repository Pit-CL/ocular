# Ocular Manzanilla Deutan — fragmento [theme.custom] para ~/.config/herdr/config.toml
# 19 tokens soportados (CustomThemeColors, verificado 2026-08-20 contra herdr 0.8.2).
[theme.custom]
panel_bg = "#f5efe7"      # base
sidebar_bg = "#eee8df"   # fondo propio del cuerpo del sidebar (token nuevo herdr 0.8.2, 2026-08-20 —
                          # hasta 0.8.1 era transparente y heredaba el background del terminal)
surface_dim = "#d9d3c9"   # ya NO pinta la fila activa del sidebar en 0.8.2 (ver active_row_bg);
                          # se deja definido — token válido, fix APCA 2026-07-26: overlay0 media Lc
                          # 38-42 con el texto por encima — WCAG 2.x aprueba pares que APCA rechaza,
                          # y los pares de Ocular se validan con APCA (color_science.lc), no con el
                          # ratio WCAG. surface1 da texto legible (Lc ≥ 71 en ambos modos) y sigue
                          # siendo más oscuro que panel_bg. Descartados: morados de Mocha (mauve/
                          # lavender, muy claros para bg), #8839ef mauve de Latte (muy
                          # eléctrico), #574b7d custom.
active_row_bg = "#d9d3c9"  # bg de la fila Space/Agent ACTIVA del sidebar (token nuevo herdr
                          # 0.8.2, 2026-08-19 — antes caía al azul default del tema base)
selection_bg = "#cdc6bd"  # cursor de navigate-mode (token nuevo herdr 0.8.2, 2026-08-19)
surface0 = "#e3ddd4"
surface1 = "#d9d3c9"
overlay0 = "#a19c94"
overlay1 = "#918b84"
text = "#3f372d"
subtext0 = "#675f57"
accent = "#8c4900"        # peach — marco activo cálido + selección del sidebar (fix bordes azules, 2026-07-26)
blue = "#2c5aa3"
mauve = "#824992"
green = "#3f6b26"
red = "#983c41"
yellow = "#614a00"
peach = "#8c4900"
teal = "#006561"

